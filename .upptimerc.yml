# Upptime config for status.darkstardev.us
# Repo: jgruber96/status (public, created from the upptime/upptime template)
# Replace every <PLACEHOLDER> with the real hostname/path or a keyword
# that only appears on the healthy page.

owner: jgruber96
repo: status
user-agent: jgruber96

# Strict allowlist of the GitHub Actions secrets Upptime may use.
secrets:
  - CF_BYPASS_TOKEN      # header Cloudflare's WAF uses to let the probes through
  - CHORE_APP_URL        # keeps the family app's hostname out of the public repo

# Delete short blips (<15 min) from the incident history? false = keep them.
skipDeleteIssues: false

sites:
  - name: darkstarinc.us
    slug: darkstarinc
    url: https://darkstarinc.us
    icon: https://darkstarinc.us/icon.svg
    #headers:
      #- "X-Status-Probe: $CF_BYPASS_TOKEN"
    maxResponseTime: 5000
    __dangerous__body_down_if_text_missing: "darkstarinc"
    
  - name: darkstarDEV.us
    slug: darkstardev
    url: https://darkstardev.us
    icon: https://darkstardev.us/icon.svg
    headers:
      - "X-Status-Probe: $CF_BYPASS_TOKEN"
    maxResponseTime: 5000
    __dangerous__body_down_if_text_missing: "darkstarDEV"

  - name: StarChores · Landing
    slug: starchores-landing
    url: https://darkstardev.us/starchores/
    icon: https://darkstardev.us/starchores/favicon.svg
    headers:
      - "X-Status-Probe: $CF_BYPASS_TOKEN"
    maxResponseTime: 5000
    __dangerous__body_down_if_text_missing: "StarChores"

  - name: StarChores · Privacy
    slug: starchores-privacy
    url: https://darkstardev.us/starchores/#privacy
    icon: https://darkstardev.us/starchores/favicon.svg
    headers:
      - "X-Status-Probe: $CF_BYPASS_TOKEN"
    maxResponseTime: 5000
    __dangerous__body_down_if_text_missing: "Privacy"

  - name: StarChores · Support
    slug: starchores-support
    url: https://darkstardev.us/starchores/support/
    icon: https://darkstardev.us/starchores/favicon.svg
    headers:
      - "X-Status-Probe: $CF_BYPASS_TOKEN"
    maxResponseTime: 5000
    __dangerous__body_down_if_text_missing: "support@darkstardev.us"

  # GET only — never POST, or every check emails support.
  # Needs a /health route in the contact-form container that returns {"status":"ok"}.
  #- name: Contact form
   # slug: contact-form
    #url: https://<CONTACT FORM HOST>/health
    #headers:
     # - "X-Status-Probe: $CF_BYPASS_TOKEN"
    #maxResponseTime: 5000
    #__dangerous__body_down_if_regex_missing: '"status":\s*"ok"'

  # Umami's built-in heartbeat endpoint.
  - name: Analytics
    slug: analytics
    url: https://stats.darkstardev.us/api/heartbeat
    headers:
      - "X-Status-Probe: $CF_BYPASS_TOKEN"
    maxResponseTime: 5000

  # Hostname stored as a repo secret, shown publicly only by this name.
  - name: StarChores web app
    slug: chore-web
    url: $CHORE_APP_URL
    icon: https://darkstardev.us/starchores/favicon.svg
    headers:
      - "X-Status-Probe: $CF_BYPASS_TOKEN"
    maxResponseTime: 5000

status-website:
  cname: status.darkstardev.us
  name: darkstarDEV status
  introTitle: "$ status --all"
  introMessage: "Self-hosted services for darkstarDEV.us and StarChores. Probed every 5 minutes from outside the home network."
  themeUrl: https://status.darkstardev.us/amber.css
  customHeadHtml: '<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=Manrope:wght@400;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">'
  navbar:
    - title: Status
      href: /
    - title: darkstarDEV.us
      href: https://darkstardev.us
  metaTags:
    - name: "color-scheme"
      content: "dark light"

i18n:
  allSystemsOperational: "[ OK ] all systems operational"
  footer: "© DarkstarDEV · probed from GitHub Actions"

workflowSchedule:
  uptime: "*/5 * * * *"
